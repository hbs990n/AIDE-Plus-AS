name: Build AIDE-Plus-AS APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 源码里写的是 -Xmx20480m，GitHub Runner 只有 ~7GB 内存，会直接 OOM。
      - name: Cap Gradle heap for runner
        run: sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8/' gradle.properties

      # 缓存编译产物（build/）与 Gradle 项目缓存（.gradle/），让失败后重编从中断处继续。
      # 依赖包缓存由 setup-java 的 cache: gradle 负责，这里只管产物。
      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            build
            .gradle
          key: build-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            build-${{ github.ref_name }}-
            build-master-

      - name: Build default release APK
        run: ./gradlew :app:assembleDefaultRelease --no-daemon --stacktrace --continue

      - name: Locate APK
        id: apk
        run: |
          APK=$(find build/app/outputs/apk -name '*.apk' -type f | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          ls -lh build/app/outputs/apk/*/release/ 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIDE-Plus-AS
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
