name: Build AIDE-Plus-AS APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 源码里写的是 -Xmx20480m，GitHub Runner 只有 ~7GB 内存，会直接 OOM。
      - name: Cap Gradle heap for runner
        run: sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8/' gradle.properties

      - name: Build default release APK
        run: ./gradlew :app:assembleDefaultRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find build/app/outputs/apk -name '*.apk' -type f | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          ls -lh build/app/outputs/apk/*/release/ 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIDE-Plus-AS
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
